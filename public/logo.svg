<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="busGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Bus Icon -->
  <g transform="translate(10, 10)">
    <!-- Bus Body -->
    <rect x="0" y="8" width="40" height="20" rx="3" fill="url(#busGradient)" stroke="#1E40AF" stroke-width="1"/>
    
    <!-- Windows -->
    <rect x="3" y="10" width="8" height="6" rx="1" fill="#E0F2FE" opacity="0.9"/>
    <rect x="13" y="10" width="8" height="6" rx="1" fill="#E0F2FE" opacity="0.9"/>
    <rect x="23" y="10" width="8" height="6" rx="1" fill="#E0F2FE" opacity="0.9"/>
    <rect x="33" y="10" width="5" height="6" rx="1" fill="#E0F2FE" opacity="0.9"/>
    
    <!-- Wheels -->
    <circle cx="8" cy="28" r="3" fill="#374151" stroke="#1F2937" stroke-width="1"/>
    <circle cx="32" cy="28" r="3" fill="#374151" stroke="#1F2937" stroke-width="1"/>
    
    <!-- Headlights -->
    <circle cx="2" cy="12" r="1" fill="#FEF3C7"/>
    <circle cx="2" cy="16" r="1" fill="#FEF3C7"/>
    
    <!-- Door -->
    <rect x="15" y="16" width="6" height="12" rx="1" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="0.5"/>
    <line x1="18" y1="16" x2="18" y2="28" stroke="#9CA3AF" stroke-width="0.5"/>
  </g>
  
  <!-- Text -->
  <text x="65" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#logoGradient)">BusTicket</text>
  <text x="65" y="40" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Your Journey Starts Here</text>
</svg>
