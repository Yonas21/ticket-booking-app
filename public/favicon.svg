<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="busFaviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#faviconGradient)" stroke="#1E40AF" stroke-width="1"/>
  
  <!-- Bus Icon -->
  <g transform="translate(4, 8)">
    <!-- Bus Body -->
    <rect x="0" y="2" width="20" height="10" rx="2" fill="url(#busFaviconGradient)" stroke="#1E40AF" stroke-width="0.5"/>
    
    <!-- Windows -->
    <rect x="1.5" y="3" width="4" height="3" rx="0.5" fill="#E0F2FE" opacity="0.9"/>
    <rect x="6.5" y="3" width="4" height="3" rx="0.5" fill="#E0F2FE" opacity="0.9"/>
    <rect x="11.5" y="3" width="4" height="3" rx="0.5" fill="#E0F2FE" opacity="0.9"/>
    <rect x="16.5" y="3" width="2.5" height="3" rx="0.5" fill="#E0F2FE" opacity="0.9"/>
    
    <!-- Wheels -->
    <circle cx="4" cy="14" r="1.5" fill="#374151" stroke="#1F2937" stroke-width="0.5"/>
    <circle cx="16" cy="14" r="1.5" fill="#374151" stroke="#1F2937" stroke-width="0.5"/>
    
    <!-- Headlights -->
    <circle cx="1" cy="4" r="0.5" fill="#FEF3C7"/>
    <circle cx="1" cy="6" r="0.5" fill="#FEF3C7"/>
  </g>
</svg>
